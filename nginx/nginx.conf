server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Docker's embedded DNS. Without it nginx resolves the api name once at
        # startup and keeps hitting a stale IP after the container is recreated (502).
        resolver 127.0.0.11 valid=10s ipv6=off;

        # A variable in proxy_pass forces nginx to re-resolve the name per request.
        set $upstream_api api;
        proxy_pass http://$upstream_api:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri /index.html;
    }
}
